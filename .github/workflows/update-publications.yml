# Refreshes _data/auto_publications.json every Monday (and on demand from the
# Actions tab → "Update publications" → Run workflow).
#
# To use Google Scholar: create a key at https://serpapi.com, then on GitHub go to
# Settings → Secrets and variables → Actions → New repository secret,
# name it SERPAPI_KEY and paste the key. Without it, OpenAlex is used.
name: Update publications

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_publications.py --scholar-id 1tGv4IIAAAAJ --openalex A5009239429

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _data/auto_publications.json; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/auto_publications.json
          git commit -m "Update publications"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow may not trigger a Pages build on their own
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push."
