<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="page-{{ page.slug | default: 'page' }}">
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% for script in page.scripts %}<script src="{{ script | relative_url }}" defer></script>
{% endfor %}
</body>
</html>
