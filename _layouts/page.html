---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </div>
</section>
<section class="wrap page-body{% if page.wide %} page-body--wide{% endif %}">
{{ content }}
</section>
