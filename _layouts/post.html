---
layout: default
---
<article class="post">
  <header class="page-hero">
    <div class="wrap wrap--narrow">
      <p class="kicker"><a href="{{ '/news/' | relative_url }}">News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
      <h1>{{ page.title }}</h1>
      {% if page.tags.size > 0 %}<p class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</p>{% endif %}
    </div>
  </header>
  <div class="wrap wrap--narrow prose">
    {% if page.image %}<img class="post-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: '' }}">{% endif %}
    {{ content }}
    <p class="back-link"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
  </div>
</article>
