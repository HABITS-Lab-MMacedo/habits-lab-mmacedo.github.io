<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <line x1="8" y1="9" x2="22" y2="7" /><line x1="8" y1="9" x2="11" y2="23" />
        <line x1="22" y1="7" x2="24" y2="21" /><line x1="11" y1="23" x2="24" y2="21" />
        <line x1="8" y1="9" x2="24" y2="21" />
        <circle cx="8" cy="9" r="3.2" class="n1" /><circle cx="22" cy="7" r="2.4" class="n2" />
        <circle cx="11" cy="23" r="2.4" class="n2" /><circle cx="24" cy="21" r="3.2" class="n3" />
      </svg>
      <span class="brand-text"><strong>HABITS</strong> Lab</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {% for item in site.navigation %}
          {% assign active = false %}
          {% if page.url == item.url %}{% assign active = true %}{% endif %}
          {% if item.url == "/news/" and page.layout == "post" %}{% assign active = true %}{% endif %}
          <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
