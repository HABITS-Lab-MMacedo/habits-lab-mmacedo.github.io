        research:
          - title: Human behaviour, networks & complex systems
            items:
              - topic: Mobility
                text: How gender, parenthood, household structure and socioeconomic status shape human mobility and urban inequality — and how commodities move, modelled with vector fields.
              - topic: Collective memory
                text: The local and global components of collective memory, measured from multilingual online attention data.
              - topic: Science of science
                text: How women and men build research careers, and gender inequality in scientific rankings.
              - topic: Online communication
                text: Gendered engagement, visibility and interaction on social media.
              - topic: Public health
                text: Human behaviour and its digital traces during epidemics.
              - topic: Education
                text: Cohort homophily and heterogeneity as drivers of student persistence in STEM.
          - title: Explainable & responsible AI
            items:
              - topic: Explainable AI
                text: Social interaction networks that reveal how swarm intelligence algorithms work.
              - topic: Machine learning
                text: Reinforcement learning for swarm intelligence and for hyperparameter optimisation.
              - topic: Digital democracy
                text: Online platforms, deployed in several countries, that collect preferences on policy proposals and measure political polarisation.
              - topic: Human behaviour
                text: Experiments across countries on perception, memory and behaviour.
              - topic: Impact of AI
                text: How people perceive and use AI tools.
