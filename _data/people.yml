        # Bio: separate paragraphs with an empty line
        bio: |-
          Mariana Macedo is an Assistant Professor of Computer Science & Engineering
          at Constructor University in Bremen and leads the HABITS Lab. Mariana's
          research combines data science, network science and AI to understand how
          social, historical and structural factors shape unequal access to
          opportunities — from mobility and careers to resources, health and
          fairness. The work also turns to AI systems themselves, modelling how
          agents interact in order to make AI more transparent, accountable, fair and
          trustworthy.

          Before joining Constructor University in 2026, Mariana was an Assistant
          Professor in Data Science at Northeastern University London and a
          postdoctoral researcher at the Center for Collective Learning (ANITI,
          University of Toulouse). Mariana holds a PhD in Computer Science from the
          University of Exeter, and an MSc and BSc in Computer Engineering from the
          University of Pernambuco, Brazil.
