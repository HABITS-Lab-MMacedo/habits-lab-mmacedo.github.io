# Per person:
#   name    (required)
#   role    e.g. "PhD Student"
#   topic   one short line about what they work on
#   photo   static image, e.g. /assets/img/people/mariana.jpg
#   gif     optional animated GIF, e.g. /assets/img/people/mariana.gif
#           -> plays on hover (see people_gif_mode in _config.yml)
#   link    personal website, Google Scholar or LinkedIn
#
# Tip: square images (e.g. 600×600) look best. Keep GIFs under ~2 MB.
# Without a photo, a placeholder with the person's initials is shown.
# ------------------------------------------------------------------

groups:
  - title: Principal Investigator
    members:
      - name: Mariana Macedo
        title: Prof. Dr.
        role: Assistant Professor of Computer Science & Engineering
        topic: network science, complex systems, human behaviour
        photo: /assets/img/people/example.png   # TODO: real photo
        gif: /assets/img/people/example.gif     # TODO: real GIF
        link: /people/mariana-macedo/
        # --- Everything below is shown on the PI's own page
        #     (mariana-macedo.html → /people/mariana-macedo/) ---
        bio: >-
          Mariana leads the HABITS Lab at Constructor University's School of
          Computer Science & Engineering. Her research combines data science,
          network science and AI to understand how social, historical and
          structural factors shape unequal access to opportunities — from
          mobility and careers to resources, health and fairness. She also
          studies AI systems themselves, modelling how agents interact in order
          to make AI more transparent, accountable, fair and trustworthy.
        interests:
          - Applied AI & human–AI interfaces
          - Human dynamics
          - Gender, race & socioeconomic inequalities
          - Complex & urban systems
          - Swarm intelligence & evolutionary computation
        email: mmacedo@constructor.university
        office: Research I, Room 86
