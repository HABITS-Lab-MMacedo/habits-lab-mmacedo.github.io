- title: Academic Mobility as a Driver of Productivity
  subtitle: a gender-centric approach
  authors: [Mariana Macedo, Ana Maria Jaramillo, Ronaldo Menezes]
  venue: ""   # TODO
  year: ""    # TODO
  topic: Academia
  drive: 1k5RJ8S8CSK2ZWb6FkHHyMfuJR9U82ake   # poster2.pdf
  image: /assets/img/posters/poster2.jpg
  large: /assets/img/posters/poster2-large.jpg
  summary: >-
    National and international mobility raises productivity for everyone, but women who move gain productivity without a matching gain in citation impact.

- title: Gender differences in work-related mobility in Colombia
  authors: [Mariana Macedo, Laura Lotero, Alessio Cardillo, Ronaldo Menezes, Hugo Barbosa]
  venue: ""   # TODO
  year: ""    # TODO
  topic: Mobility
  drive: 1Ya-aylQwPtIa6jyDjqR1Twg7HfFXQSSi   # poster1.pdf
  image: /assets/img/posters/poster1.jpg
  large: /assets/img/posters/poster1-large.jpg
  summary: >-
    Network science and clustering on commuting surveys from the Aburrá Valley (2005 and 2017) show that work trips became more gender-neutral over time, with the strongest imbalance among low- and middle-income groups.
