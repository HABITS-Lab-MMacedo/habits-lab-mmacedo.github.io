  venue: ""   # TODO
  year: ""    # TODO
  topic: Social media
  drive: 1me3Lhc_eCGhjfogF9mMnNOnc5KLpj05q   # poster3.pdf
  image: /assets/img/posters/poster3.jpg
  large: /assets/img/posters/poster3-large.jpg
