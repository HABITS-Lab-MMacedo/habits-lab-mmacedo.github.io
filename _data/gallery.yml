# ------------------------------------------------------------------
# GALLERY — photos shown on /gallery/ (in this order)
#
# Photos are NOT stored in this repository: they load from the lab's
# Google Drive folder, which must stay shared as "Anyone with the link":
#   https://drive.google.com/drive/folders/1zPb2P4pLu7sS39M_jPKU4A236bpAiqF5
#
# Per photo:
#   drive    file ID (right-click the photo in Drive → Share → Copy link;
#            the ID is the part between /d/ and /view)
#   album    group used for the filter buttons, e.g. "Talks"
#   caption  short text shown under the photo (optional)
#   alt      description for screen readers (optional, falls back to caption)
#   w, h     width and height (or just the ratio, e.g. 4 and 3) so the
#            layout doesn't jump while photos load
#
# To hide a photo without deleting it, put a # in front of each of its lines.
# ------------------------------------------------------------------

