# ------------------------------------------------------------------
# PUBLICATIONS ADDED BY HAND
#
# Most papers come in automatically: a weekly GitHub Action fetches the
# PI's Google Scholar profile (or OpenAlex) into _data/auto_publications.json
# — don't edit that file, it is overwritten.
#
# Add papers here only if they are NOT on that profile (e.g. a student's
# paper without the PI). Fields:
#   title    (required)
#   authors  write lab members exactly as in people.yml to highlight them
#   venue    journal or conference
#   year     (required)
#   type     journal | conference | preprint | book | data
#   url / doi / pdf / code / data   optional links
#   selected true -> also shown on the Home page
#
# Example:
# - title: "Paper title"
#   authors: "Student Name, Mariana Macedo"
#   venue: "Applied Network Science"
#   year: 2026
#   type: journal
#   doi: "10.1007/..."
#   selected: true
# ------------------------------------------------------------------
