# ------------------------------------------------------------------
# CONFERENCE DEADLINES — the Deadlines page shows live countdowns.
#
#   name        short name with year, e.g. "ICWSM 2027"
#   full        full conference name
#   url         call for papers
#   location    city, country
#   area        Network Science | Computational Social Science |
#               Web & Social Media | HCI & Society | AI & Fairness
#   conference  conference dates as free text
#   deadlines   list of { label, date: "YYYY-MM-DD", time: "HH:MM", tz }
#               time defaults to 23:59, tz defaults to AoE (UTC−12).
#               tz can also be a number of hours, e.g. 1 for CET, 0 for UTC.
#   note        optional, e.g. "rolling submissions"
#
# Leave deadlines empty ( deadlines: [] ) when dates are not announced yet.
# Initial dates collected on 2026-10-25 from casp.jp/social-computing-deadlines
# and the official sites — always confirm on the official call for papers.
# ------------------------------------------------------------------

